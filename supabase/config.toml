project_id = "Nolt-hr"
# Auth settings only; SMTP credentials remain configured in the hosted dashboard.
[auth]
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback", "http://127.0.0.1:3000/auth/callback**", "http://localhost:3000/auth/callback", "http://localhost:3000/auth/callback**", "http://127.0.0.1:3000/invitations/accept**", "http://localhost:3000/invitations/accept**", "http://127.0.0.1:3000/external/accept**", "https://nolt-hr.vercel.app/external/accept**"]
enable_signup = true
minimum_password_length = 12
[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
[auth.mfa]
max_enrolled_factors = 3
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
[db.migrations]
enabled = false
[db.seed]
enabled = false
sql_paths = []
