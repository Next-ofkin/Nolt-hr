name: GitHub runner diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/runner-diagnostic.yml"
permissions:
  contents: read
jobs:
  runner-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Runner startup
        run: |
          echo "Runner started"
          uname -a
          node --version
