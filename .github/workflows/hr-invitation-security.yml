name: HR invitation security checks

on:
  pull_request:
    paths:
      - "apps/api/src/hr-invitation-*.ts"
      - "apps/api/src/supabase-auth.ts"
      - "apps/web/src/app/hr-invitations/**"
      - "tests/hr-invitation-*.test.ts"
      - ".github/workflows/hr-invitation-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invitation-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Build shared contracts
        run: npm run contracts:build
      - name: Run HR invitation regressions
        run: npx tsx --test --test-concurrency=1 tests/hr-invitation-*.test.ts
      - name: Typecheck backend
        run: npm run typecheck -w @nolt/api
