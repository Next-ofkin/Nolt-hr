name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://nolt_app:local-app-password@127.0.0.1:54329/nolt_hr
      DIRECT_DATABASE_URL: postgresql://postgres:local-owner-password@127.0.0.1:54329/nolt_hr
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: local-owner-password
          POSTGRES_DB: nolt_hr
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nolt_hr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare synthetic database
        env:
          PGPASSWORD: local-owner-password
        run: |
          cp .env.example .env
          psql -h 127.0.0.1 -p 54329 -U postgres -d nolt_hr -c "CREATE ROLE nolt_app LOGIN PASSWORD 'local-app-password' NOSUPERUSER NOCREATEDB NOCREATEROLE"
          npm run contracts:build
          npm run db:generate
          npm run db:migrate
          npm run db:permissions
      - run: npm run api:generate
      - name: Check generated contract is current
        run: git diff --exit-code -- docs/api/openapi.json packages/api-client/src/schema.d.ts
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start local test services
        run: |
          npm run start -w @nolt/api > /tmp/nolt-api.log 2>&1 &
          npm run start -w @nolt/web > /tmp/nolt-web.log 2>&1 &
          node scripts/wait-for-services.mjs
      - run: npm test
      - name: Verify isolated workflow persistence and concurrency
        run: npm run test:domain
      - run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: test-results/
