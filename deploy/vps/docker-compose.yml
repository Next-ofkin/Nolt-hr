# NOLT HR on one VPS: API (private) + web + Caddy (automatic HTTPS).
# Run from /opt/nolt/deploy/vps with SITE_HOST set in .env (see setup.sh).
services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile.api
    env_file: .env.api
    environment:
      PORT: "8080"
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
  web:
    build:
      context: ../..
      dockerfile: Dockerfile.web
      args:
        API_ORIGIN: http://api:8080
        # Optional branding, read from deploy/vps/.env when the image is built (see docs/BRANDING_AND_DEPLOYMENT.md).
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-}
        NEXT_PUBLIC_PRODUCT_NAME: ${NEXT_PUBLIC_PRODUCT_NAME:-}
        NEXT_PUBLIC_BRAND_TAGLINE: ${NEXT_PUBLIC_BRAND_TAGLINE:-}
        NEXT_PUBLIC_BRAND_DESCRIPTION: ${NEXT_PUBLIC_BRAND_DESCRIPTION:-}
        NEXT_PUBLIC_BRAND_PRIMARY: ${NEXT_PUBLIC_BRAND_PRIMARY:-}
        NEXT_PUBLIC_BRAND_LOGO_PATH: ${NEXT_PUBLIC_BRAND_LOGO_PATH:-}
    environment:
      PORT: "8080"
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-extra:/etc/caddy/extra:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
